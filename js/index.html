<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lune Gore SVG Generator</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #eef2ff, #dde6f3 55%, #d7dce8 100%);
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 0.75rem;
      }

      #preview-panel {
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #cfd8ea;
        border-radius: 16px;
        box-shadow: 0 18px 36px rgba(26, 38, 60, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        overflow: hidden;
      }

      #preview {
        width: calc(100% - 1.25rem);
        height: calc(100% - 3.5rem);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #preview svg {
        width: 100%;
        height: 100%;
        background: #ffffff;
        border: 1px solid #d8deea;
      }

      #meta {
        margin: 0;
        font-size: 0.9rem;
        color: #2d405d;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section id="preview-panel">
        <div id="preview"></div>
        <p id="meta"></p>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
